server:
  port: 9091

spring:
  application:
    name: payment-service
  datasource:
    # "postgres-db" isn't a real internet address — it's the name of the Postgres
    # container in docker-compose.yml. Inside Docker's internal network,
    # containers can find each other by service name.
    url: jdbc:postgresql://postgres-db:5432/${DB_NAME:paygate_db}
    username: ${DB_USERNAME:postgres}
    # No default on purpose: the service refuses to start without a real password.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      # "validate" only checks that the Java entities match the tables.
      ddl-auto: validate
    # Don't keep a database connection open while the HTTP response is written.
    open-in-view: false
  flyway:
    # auth-service and payment-service share one database, so each keeps its own
    # migration history table.
    table: flyway_payment_history
    # The database may already contain tables (from before Flyway, or from
    # auth-service). Mark that starting point as version 0 so V1 still runs —
    # V1 uses IF NOT EXISTS, so it is safe either way.
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    service-url:
      # Same idea — "eureka-server" is a container name, not "localhost"
      defaultZone: http://eureka-server:8761/eureka/

# eSewa ePay v2. Defaults are eSewa's public sandbox (UAT) merchant —
# no registration needed. Override with env vars for a real merchant account.
# Values are quoted because the sandbox secret contains ':' and '&'.
esewa:
  product-code: "${ESEWA_PRODUCT_CODE:EPAYTEST}"
  secret-key: "${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}"
  form-url: "${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}"
  status-url: "${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}"
  # eSewa redirects the user's browser here, so these go through the gateway (8080)
  success-url: "${ESEWA_SUCCESS_URL:http://localhost:8080/api/payments/esewa/success}"
  failure-url: "${ESEWA_FAILURE_URL:http://localhost:8080/api/payments/esewa/failure}"
  # After verifying, we send the browser to this frontend page
  result-page-url: "${ESEWA_RESULT_PAGE_URL:http://localhost:3000/result.html}"

# Background job that re-checks payments stuck in PENDING (PendingPaymentReconciler).
payments:
  reconcile:
    enabled: true
    interval: PT5M      # run every 5 minutes
    older-than: PT15M   # only payments started more than 15 minutes ago
