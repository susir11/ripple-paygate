server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 5 keeps its settings under server.webflux
      # (older versions used spring.cloud.gateway.* directly).
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            # eSewa sends the user's browser back here after payment. Listed BEFORE the
            # general payment route so it wins, and deliberately without the circuit
            # breaker: callbacks are slow (they call eSewa's status API), so they could
            # trip the breaker's slow-call threshold — and an open breaker would show a
            # paying user a JSON error and leave their payment PENDING. payment-service
            # caps its own eSewa calls with timeouts instead.
            - id: esewa-callback-route
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/esewa/success,/api/payments/esewa/failure

            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentCircuitBreaker
                    fallbackUri: forward:/fallback/payment

          default-filters:
            - AddRequestHeader=X-INTERNAL-GATEWAY,true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# No default on purpose: JwtAuthFilter refuses to start without a real secret.
jwt:
  secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      paymentCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
  # How long the gateway waits for payment-service before giving up and
  # returning the fallback. Resilience4j's default is 1s, which is too short:
  # the eSewa success callback calls eSewa's status API (takes ~1–3s) before
  # answering. payment-service caps that call at 3s connect + 5s read, so 10s
  # leaves headroom.
  timelimiter:
    instances:
      paymentCircuitBreaker:
        timeout-duration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
